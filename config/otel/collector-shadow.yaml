receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  resource/sanitize:
    attributes:
      - key: user.email
        action: delete
      - key: tenant.id
        action: delete
      - key: authorization
        action: delete
      - key: api.key
        action: delete
      - key: credential.reference
        action: delete
  attributes/sanitize:
    actions:
      - key: user.email
        action: delete
      - key: tenant.id
        action: delete
      - key: prompt
        action: delete
      - key: tool.arguments
        action: delete
      - key: authorization
        action: delete
      - key: api.key
        action: delete
      - key: credential.reference
        action: delete
      - key: http.url
        action: delete
      - key: db.statement
        action: delete
  batch:
    timeout: 1s
    send_batch_size: 128

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/sanitize, attributes/sanitize, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/sanitize, attributes/sanitize, batch]
      exporters: [debug]
