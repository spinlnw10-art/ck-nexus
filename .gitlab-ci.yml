stages:
  - test
  - sast
  - secret-detection
  - evidence

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  GIT_DEPTH: "0"
  SAST_STAGE: sast
  AST_ENABLE_MR_PIPELINES: "true"
  SECRET_DETECTION_HISTORIC_SCAN: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  UV_LINK_MODE: copy

unit_tests:
  stage: test
  image: python:3.12-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git build-essential libseccomp-dev
    - rm -rf /var/lib/apt/lists/*
    - python -m pip install --no-cache-dir uv
  script:
    - uv sync --all-extras --dev --frozen
    - uv run --no-sync pytest -q -m 'not cgroup_staging' --junitxml=report.xml
  artifacts:
    when: always
    expire_in: 90 days
    reports:
      junit: report.xml
    paths:
      - report.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

cgroup_v2_staging:
  stage: evidence
  tags:
    - cknexus-cgroup-v2
  before_script:
    # Shell executor runs on the delegated host; Docker images and apt-get are unavailable.
    - command -v python3.12
    - python3.12 --version
    - command -v uv
    - command -v git
    - command -v gcc
    - test -n "${CKNEXUS_AGNES_CGROUP_ROOT:-}"
    - test -w "$CKNEXUS_AGNES_CGROUP_ROOT"
    - test -r "$CKNEXUS_AGNES_CGROUP_ROOT/cgroup.subtree_control"
    - grep -qw cpu "$CKNEXUS_AGNES_CGROUP_ROOT/cgroup.subtree_control"
    - grep -qw memory "$CKNEXUS_AGNES_CGROUP_ROOT/cgroup.subtree_control"
    - grep -qw pids "$CKNEXUS_AGNES_CGROUP_ROOT/cgroup.subtree_control"
  script:
    - uv sync --python 3.12 --all-extras --dev --frozen
    - set -o pipefail
    - CKNEXUS_ENVIRONMENT=staging uv run --python 3.12 --no-sync python scripts/agnes_cgroup_v2_staging_gate.py --root "$CKNEXUS_AGNES_CGROUP_ROOT" | tee q12-cgroup-gate.json
    - uv run --python 3.12 --no-sync pytest -q -m cgroup_staging --junitxml=cgroup-report.xml
  artifacts:
    when: always
    expire_in: 90 days
    reports:
      junit: cgroup-report.xml
    paths:
      - cgroup-report.xml
      - q12-cgroup-gate.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

node_syntax_typecheck:
  stage: test
  image: node:24-bookworm-slim
  script:
    - node --check council-runtime/node/capability-client.js
    - cd integrations/opencode-control-bridge
    - npm install --ignore-scripts --no-audit --no-fund
    - npm run typecheck
    - printf '%s\n' '<testsuites><testsuite name="node_syntax_typecheck" tests="2" failures="0" errors="0" skipped="0"><testcase classname="node" name="capability-client.js syntax"/><testcase classname="typescript" name="opencode-control-bridge typecheck"/></testsuite></testsuites>' > "$CI_PROJECT_DIR/node-report.xml"
  artifacts:
    when: always
    expire_in: 90 days
    reports:
      junit: node-report.xml
    paths:
      - node-report.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

semgrep-sast:
  when: always
  stage: sast
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

secret_detection:
  when: always
  stage: secret-detection
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

evidence_manifest:
  when: always
  stage: evidence
  image: python:3.12-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git
    - rm -rf /var/lib/apt/lists/*
    - python -m pip install --no-cache-dir 'defusedxml>=0.7.1,<1'
  needs:
    - job: unit_tests
      artifacts: true
    - job: node_syntax_typecheck
      artifacts: true
    - job: cgroup_v2_staging
      artifacts: true
    - job: semgrep-sast
      artifacts: true
    - job: secret_detection
      artifacts: true
  script:
    - python scripts/gitlab_evidence_manifest.py
    - cat evidence/gitlab/ci-evidence.json
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - report.xml
      - node-report.xml
      - cgroup-report.xml
      - q12-cgroup-gate.json
      - evidence/gitlab/ci-evidence.json
      - evidence/gitlab/evidence-graph.json
      - evidence/gitlab/historical-evidence.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
