name: OTel Telemetry Policy Shadow

on:
  pull_request:
    paths:
      - "scripts/assurance/otel_telemetry_policy.py"
      - "tests/assurance/test_otel_telemetry_policy.py"
      - "scripts/assurance/OTEL_TELEMETRY_POLICY.md"
      - ".github/workflows/otel-telemetry-policy-shadow.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: otel-telemetry-policy-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-policy-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact pull request candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run offline telemetry policy tests
        run: python -m unittest tests.assurance.test_otel_telemetry_policy -v
