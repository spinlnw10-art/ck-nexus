name: Verify Q12 delegated cgroup v2 on ephemeral GitHub Linux
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  q12:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CKNEXUS_ENVIRONMENT: staging
    steps:
      - name: Checkout exact caller candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve immutable release identity
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          tree=$(git rev-parse 'HEAD^{tree}')
          manifest=$(git ls-tree -r HEAD -- app creator_app services gateway orchestration idea_engine migrations deploy observability Dockerfile docker-compose.prod.yml main.py pyproject.toml uv.lock | sha256sum | awk '{print $1}')
          test "$sha" = "$GITHUB_SHA"
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "source_tree=$tree" >> "$GITHUB_OUTPUT"
          echo "release_subject=$manifest" >> "$GITHUB_OUTPUT"
      - name: Prove non-root runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          echo "runner_user=$(id -un)"
          echo "runner_uid=$(id -u)"
          test -f /sys/fs/cgroup/cgroup.controllers
      - name: Create isolated delegated cgroup v2 subtree
        id: delegate
        shell: bash
        run: |
          set -euo pipefail
          root="/sys/fs/cgroup/cknexus-q12-$GITHUB_RUN_ID"
          available=$(cat /sys/fs/cgroup/cgroup.controllers)
          for controller in cpu memory pids; do grep -qw "$controller" <<< "$available"; done
          current=$(cat /sys/fs/cgroup/cgroup.subtree_control)
          ops=""
          for controller in cpu memory pids; do
            if ! grep -qw "$controller" <<< "$current"; then ops="$ops +$controller"; fi
          done
          if [ -n "$ops" ]; then printf '%s\n' "$ops" | sudo tee /sys/fs/cgroup/cgroup.subtree_control >/dev/null; fi
          sudo mkdir "$root"
          sudo chown "$(id -u):$(id -g)" "$root"
          sudo chown "$(id -u):$(id -g)" "$root/cgroup.procs" "$root/cgroup.subtree_control"
          child_available=$(cat "$root/cgroup.controllers")
          for controller in cpu memory pids; do grep -qw "$controller" <<< "$child_available"; done
          printf '+cpu +memory +pids\n' > "$root/cgroup.subtree_control"
          test -w "$root" && test -w "$root/cgroup.procs" && test -w "$root/cgroup.subtree_control"
          echo "CKNEXUS_AGNES_CGROUP_ROOT=$root" >> "$GITHUB_ENV"
          echo "delegated_root=$root" >> "$GITHUB_OUTPUT"
      - name: Run actual kernel-enforced Q12 gate as non-root
        id: gate
        shell: bash
        run: |
          set +e
          python3 scripts/agnes_cgroup_v2_staging_gate.py >Q12_CGROUP_RAW.json 2>q12-gate-error.txt
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Emit exact Q12 evidence
        if: always()
        env:
          SOURCE_SHA: ${{ steps.subject.outputs.source_sha }}
          SOURCE_TREE: ${{ steps.subject.outputs.source_tree }}
          RELEASE_SUBJECT: ${{ steps.subject.outputs.release_subject }}
          RUN_ID: ${{ github.run_id }}
          RUNNER_NAME_VALUE: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
          GATE_RC: ${{ steps.gate.outputs.rc }}
          DELEGATED_ROOT: ${{ steps.delegate.outputs.delegated_root }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          gate_rc=int(os.getenv("GATE_RC","1"))
          try: raw=json.loads(Path("Q12_CGROUP_RAW.json").read_text(encoding="utf-8"))
          except (FileNotFoundError,json.JSONDecodeError): raw=None
          try: diagnostic=Path("q12-gate-error.txt").read_text(encoding="utf-8")
          except FileNotFoundError: diagnostic=""
          passed=gate_rc==0 and isinstance(raw,dict) and raw.get("status")=="PASS"
          root=os.getenv("DELEGATED_ROOT","")
          controllers=Path(root,"cgroup.controllers").read_text().split() if root and Path(root,"cgroup.controllers").exists() else []
          evidence={
            "schema_version":7,"gate":"Q12",
            "source_sha":os.getenv("SOURCE_SHA"),"source_tree":os.getenv("SOURCE_TREE"),
            "release_subject_manifest_sha256":os.getenv("RELEASE_SUBJECT"),
            "github_run_id":int(os.getenv("RUN_ID","0")),
            "environment_class":"ephemeral-github-hosted-linux-delegated-cgroup-v2",
            "runner_name":os.getenv("RUNNER_NAME_VALUE"),"runner_os":os.getenv("RUNNER_OS_VALUE"),
            "runner_arch":os.getenv("RUNNER_ARCH_VALUE"),"runner_user":os.getenv("USER"),
            "required_identity":"non-root CK-NEXUS service identity","delegated_root":root,
            "controllers":controllers,"delegation_ready":bool(root),"gate_exit_code":gate_rc,"raw":raw,
            "actual_kernel_enforcement":passed,
            "result":"PASS" if passed else ("BLOCKED" if gate_rc==2 else "FAIL"),
            "production_promotion_allowed":passed,"diagnostic":diagnostic[:2000],
          }
          Path("Q12_CGROUP_V2.json").write_text(json.dumps(evidence,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps({k:v for k,v in evidence.items() if k!="diagnostic"},indent=2,sort_keys=True))
          PYTHON
      - name: Upload Q12 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: q12-current-${{ github.sha }}
          path: |
            Q12_CGROUP_V2.json
            Q12_CGROUP_RAW.json
            q12-gate-error.txt
          if-no-files-found: warn
          retention-days: 90
      - name: Enforce Q12
        run: test '${{ steps.gate.outputs.rc }}' -eq 0
