name: Verify Q12 delegated cgroup v2 on ephemeral GitHub Linux
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  q12:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CKNEXUS_ENVIRONMENT: staging
    steps:
      - name: Checkout exact caller candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve immutable release identity
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          tree=$(git rev-parse 'HEAD^{tree}')
          manifest=$(python3 scripts/release_subject_manifest.py)
          test "$sha" = "$GITHUB_SHA"
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "source_tree=$tree" >> "$GITHUB_OUTPUT"
          echo "release_subject=$manifest" >> "$GITHUB_OUTPUT"
      - name: Run Q12 inside a delegated systemd service as non-root
        id: gate
        shell: bash
        run: |
          set +e
          systemd_version=$(systemd --version 2>/dev/null | awk 'NR==1 {print $2}')
          systemd_major=${systemd_version%%.*}
          if ! [[ "$systemd_major" =~ ^[0-9]+$ ]] || ((systemd_major < 254)); then
            echo "systemd >=254 required for DelegateSubgroup; detected ${systemd_version:-missing}" > q12-gate-error.txt
            echo "rc=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          unit="cknexus-q12-$GITHUB_RUN_ID"
          sudo systemd-run --wait --pipe --collect --unit="$unit" \
            --property="Delegate=cpu memory pids" \
            --property="DelegateSubgroup=q12-bootstrap" \
            --property="WorkingDirectory=$GITHUB_WORKSPACE" \
            --setenv="GITHUB_WORKSPACE=$GITHUB_WORKSPACE" \
            --setenv="CKNEXUS_ENVIRONMENT=staging" \
            --setenv="PATH=$PATH" \
            --setenv="HOME=$HOME" \
            --setenv="USER=root" \
            --setenv="CKNEXUS_Q12_WORKER_USER=$(id -un)" \
            /bin/bash -lc '
              set -euo pipefail
              cg=""
              while IFS=: read -r hierarchy controllers path; do
                if [ "$hierarchy" = "0" ]; then cg="$path"; fi
              done < /proc/self/cgroup
              test -n "$cg"
              case "$cg" in
                */q12-bootstrap) cg="${cg%/q12-bootstrap}" ;;
                *) echo "systemd delegated subgroup missing from cgroup path: $cg" > "$GITHUB_WORKSPACE/q12-gate-error.txt"; exit 2 ;;
              esac
              root="/sys/fs/cgroup$cg"
              echo "$root" > "$GITHUB_WORKSPACE/q12-delegated-root.txt"
              # systemd 254+ places the service process in this delegated
              # subgroup so the parent cgroup remains process-free.
              export CKNEXUS_AGNES_CGROUP_ROOT="$root"
              available=$(cat "$root/cgroup.controllers")
              for controller in cpu memory pids; do grep -qw "$controller" <<< "$available"; done
              current=$(cat "$root/cgroup.subtree_control")
              ops=""
              for controller in cpu memory pids; do
                if ! grep -qw "$controller" <<< "$current"; then ops="$ops +$controller"; fi
              done
              if [ -n "$ops" ]; then printf "%s\n" "$ops" > "$root/cgroup.subtree_control"; fi
              enabled=$(cat "$root/cgroup.subtree_control")
              for controller in cpu memory pids; do grep -qw "$controller" <<< "$enabled"; done
              python3 - > "$GITHUB_WORKSPACE/Q12_CGROUP_RAW.json" 2> "$GITHUB_WORKSPACE/q12-gate-error.txt" <<PYTHON
          import json, os, pwd, runpy, subprocess, sys
          worker = pwd.getpwnam(os.environ["CKNEXUS_Q12_WORKER_USER"])
          real_popen = subprocess.Popen
          def spawn_as_non_root(*args, **kwargs):
              kwargs["user"] = worker.pw_uid
              kwargs["group"] = worker.pw_gid
              kwargs["extra_groups"] = []
              child = real_popen(*args, **kwargs)
              actual_uid = os.stat(f"/proc/{child.pid}").st_uid
              if actual_uid != worker.pw_uid or actual_uid == 0:
                  child.terminate()
                  raise RuntimeError("q12_worker_identity_mismatch")
              record = {"user": worker.pw_name, "uid": worker.pw_uid, "gid": worker.pw_gid, "is_non_root": True, "pid": child.pid}
              with open(os.path.join(os.environ["GITHUB_WORKSPACE"], "q12-worker-identity.json"), "w", encoding="utf-8") as handle:
                  json.dump(record, handle, sort_keys=True)
              return child
          subprocess.Popen = spawn_as_non_root
          sys.argv = ["scripts/agnes_cgroup_v2_staging_gate.py"]
          runpy.run_path(sys.argv[0], run_name="__main__")
          PYTHON
            '
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ -f q12-delegated-root.txt ]; then
            echo "delegated_root=$(cat q12-delegated-root.txt)" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Emit exact Q12 evidence
        if: always()
        env:
          SOURCE_SHA: ${{ steps.subject.outputs.source_sha }}
          SOURCE_TREE: ${{ steps.subject.outputs.source_tree }}
          RELEASE_SUBJECT: ${{ steps.subject.outputs.release_subject }}
          RUN_ID: ${{ github.run_id }}
          RUNNER_NAME_VALUE: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
          GATE_RC: ${{ steps.gate.outputs.rc }}
          DELEGATED_ROOT: ${{ steps.gate.outputs.delegated_root }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          gate_rc=int(os.getenv("GATE_RC","1"))
          try: raw=json.loads(Path("Q12_CGROUP_RAW.json").read_text(encoding="utf-8"))
          except (FileNotFoundError,json.JSONDecodeError): raw=None
          try: diagnostic=Path("q12-gate-error.txt").read_text(encoding="utf-8")
          except FileNotFoundError: diagnostic=""
          root=os.getenv("DELEGATED_ROOT","")
          health=raw.get("health",{}) if isinstance(raw,dict) else {}
          controllers=health.get("controllers",[]) if isinstance(health,dict) else []
          required=("cpu","memory","pids")
          delegation_ready=health.get("ready") is True and all(item in controllers for item in required)
          worker_path=Path("q12-worker-identity.json")
          worker_identity=json.loads(worker_path.read_text(encoding="utf-8")) if worker_path.exists() else None
          worker_user=worker_identity.get("user","") if isinstance(worker_identity,dict) else ""
          worker_non_root=isinstance(worker_identity,dict) and worker_identity.get("is_non_root") is True and int(worker_identity.get("uid",0)) > 0
          passed=gate_rc==0 and isinstance(raw,dict) and raw.get("status")=="PASS" and delegation_ready and worker_non_root
          evidence={
            "schema_version":7,"gate":"Q12",
            "source_sha":os.getenv("SOURCE_SHA"),"source_tree":os.getenv("SOURCE_TREE"),
            "release_subject_manifest_sha256":os.getenv("RELEASE_SUBJECT"),
            "github_run_id":int(os.getenv("RUN_ID","0")),
            "environment_class":"ephemeral-github-hosted-linux-systemd-delegated-cgroup-v2",
            "runner_name":os.getenv("RUNNER_NAME_VALUE"),"runner_os":os.getenv("RUNNER_OS_VALUE"),
            "runner_arch":os.getenv("RUNNER_ARCH_VALUE"),"runner_user":os.getenv("USER"),
            "required_identity":"non-root CK-NEXUS service identity",
            "manager_identity":"root delegated systemd service",
            "worker_identity":worker_identity,
            "delegated_root":root,"controllers":controllers,
            "delegation_ready":delegation_ready,"gate_exit_code":gate_rc,"raw":raw,
            "actual_kernel_enforcement":passed,
            "result":"PASS" if passed else ("BLOCKED" if gate_rc==2 else "FAIL"),
            "production_promotion_allowed":passed,"diagnostic":diagnostic[:2000],
          }
          Path("Q12_CGROUP_V2.json").write_text(json.dumps(evidence,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps({k:v for k,v in evidence.items() if k!="diagnostic"},indent=2,sort_keys=True))
          PYTHON
      - name: Upload Q12 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: q12-current-${{ github.sha }}
          path: |
            Q12_CGROUP_V2.json
            Q12_CGROUP_RAW.json
            q12-gate-error.txt
            q12-delegated-root.txt
            q12-worker-identity.json
          if-no-files-found: warn
          retention-days: 90
      - name: Enforce Q12
        run: test '${{ steps.gate.outputs.rc }}' -eq 0
