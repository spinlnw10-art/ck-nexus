name: CK-NEXUS Audit Evidence

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests/tools -v

      - name: Generate read-only audit evidence
        run: |
          python tools/cknexus_audit.py

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cknexus-audit-evidence
          path: |
            audit-output/audit-report.json
            audit-output/evidence-manifest.json
          if-no-files-found: warn
          retention-days: 14
