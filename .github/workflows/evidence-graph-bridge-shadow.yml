name: Evidence Graph Bridge Shadow

on:
  pull_request:
    paths:
      - "scripts/assurance/evidence_graph_bridge.py"
      - "tests/assurance/test_evidence_graph_bridge.py"
      - ".github/workflows/evidence-graph-bridge-shadow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-evidence-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact pull request candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run evidence graph bridge tests
        run: python -m unittest tests.assurance.test_evidence_graph_bridge -v
