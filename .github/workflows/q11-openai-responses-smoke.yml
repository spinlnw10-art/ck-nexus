name: Q11 OpenAI Responses API smoke (exact frozen subject)

on:
  workflow_dispatch:
    inputs:
      confirm_api_usage:
        description: Confirm one live OpenAI Responses API smoke request (usage may be billed)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  Q11_SOURCE_SHA: 39f5c1adb9d761ab418cf088ff1f051b1ca731d1
  Q11_SOURCE_TREE: 0525195934f703a8becf8a39f6397b2411e0bb2e
  Q11_RELEASE_SUBJECT: 89f2925cd871332b16f755f0dae1e058826c38b728f66d2001f2eaaec6301a52

jobs:
  q11:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact frozen subject
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.Q11_SOURCE_SHA }}
          fetch-depth: 1

      - name: Verify exact Q11 release subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$Q11_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$Q11_SOURCE_TREE"
          paths=(app creator_app services gateway orchestration idea_engine migrations deploy observability Dockerfile docker-compose.prod.yml main.py pyproject.toml uv.lock)
          subject="$(git ls-tree -r HEAD -- "${paths[@]}" | sha256sum | awk '{print $1}')"
          test "$subject" = "$Q11_RELEASE_SUBJECT"

      - name: Check OpenAI API secret without exposing it
        if: ${{ inputs.confirm_api_usage == true }}
        id: auth
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "OpenAI API credential is configured."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY repository secret is missing."
          fi

      - name: Set up Python
        if: ${{ inputs.confirm_api_usage == true && steps.auth.outputs.available == 'true' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install frozen dependencies
        if: ${{ inputs.confirm_api_usage == true && steps.auth.outputs.available == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "uv==0.12.4"
          uv lock --check
          uv sync --all-extras --dev --frozen

      - name: Run one live Responses API smoke request
        if: ${{ inputs.confirm_api_usage == true && steps.auth.outputs.available == 'true' }}
        id: smoke
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SMOKE_MODEL: ${{ vars.OPENAI_SMOKE_MODEL }}
        shell: bash
        run: |
          set +e
          .venv/bin/python scripts/test_openai_live.py > q11-output.txt 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build Q11 evidence
        if: always()
        env:
          CONFIRMED: ${{ inputs.confirm_api_usage }}
          AUTH_AVAILABLE: ${{ steps.auth.outputs.available }}
          SMOKE_RC: ${{ steps.smoke.outputs.exit_code }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          output = Path("q11-output.txt")
          text = output.read_text(encoding="utf-8", errors="replace") if output.exists() else ""
          rc = os.getenv("SMOKE_RC", "")
          if os.getenv("CONFIRMED") != "true":
              status, reason = "PREPARED_NOT_EXECUTED", "Live API use was not confirmed."
          elif os.getenv("AUTH_AVAILABLE") != "true":
              status, reason = "BLOCKED", "OPENAI_API_KEY repository secret is missing."
          elif rc == "0" and "CK-NEXUS-P0-SMOKE-PASS" in text:
              status, reason = "PASS", "Exact-subject live Responses API smoke returned the required sentinel."
          else:
              status, reason = "FAIL", "Live Responses API smoke did not pass."
          response_id = None
          for token in text.replace("=", " ").split():
              if token.startswith("resp_"):
                  response_id = token
          evidence = {
              "schema_version": 1,
              "gate": "Q11",
              "source_sha": os.environ["Q11_SOURCE_SHA"],
              "source_tree": os.environ["Q11_SOURCE_TREE"],
              "release_subject_manifest_sha256": os.environ["Q11_RELEASE_SUBJECT"],
              "result": status,
              "reason": reason,
              "credential_configured": os.getenv("AUTH_AVAILABLE") == "true",
              "credential_exposed": False,
              "smoke_exit_code": int(rc) if rc.isdigit() else None,
              "response_id": response_id,
              "output_sha256": hashlib.sha256(text.encode()).hexdigest(),
              "completed_at": datetime.now(timezone.utc).isoformat() if rc.isdigit() else None,
              "production_promotion_allowed": False
          }
          Path("Q11_OPENAI_LIVE.json").write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n")
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY

      - name: Upload Q11 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: q11-openai-live-${{ env.Q11_SOURCE_SHA }}-${{ github.run_id }}
          path: |
            Q11_OPENAI_LIVE.json
            q11-output.txt
          if-no-files-found: error
          retention-days: 90
