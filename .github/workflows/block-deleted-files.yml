name: Block deleted files

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  block-deleted-files:
    name: Block deleted files
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reject deleted paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          deleted="$(git diff --name-only --diff-filter=D "${BASE_SHA}" "${HEAD_SHA}" --)"
          if [[ -n "${deleted}" ]]; then
            echo "::error::Repository policy blocks file deletion in pull requests."
            printf '%s\n' "${deleted}"
            exit 1
          fi
          echo "No deleted files detected."
