name: Q16 ORT and ScanCode Shadow

on:
  pull_request:
    paths:
      - "tests/fixtures/q16-license/**"
      - "scripts/assurance/q16_evidence_manifest.py"
      - "scripts/assurance/evidence_graph_intake.py"
      - "scripts/assurance/Q16_ORT_SCANCODE_SHADOW.md"
      - "tests/assurance/test_evidence_graph_intake.py"
      - "scripts/assurance/ort-q16-config.yml"
      - "tests/assurance/test_q16_evidence_manifest.py"
      - ".github/workflows/q16-ort-scancode-shadow.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q16-ort-scancode-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact pull request candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Java 25 for ORT
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Download and hash-verify ORT 99.1.0
        env:
          ORT_SHA256: 1c0bf055287f860902ecf98e60f271c62952ea7c2df4697126ca27e8be9e5842
          ORT_SIGNATURE_SHA256: 677fb089eb2131a7a3d1b4d182de20740d08f6b078fae01f4306b30ba233a6e5
        run: |
          set -euo pipefail
          base="https://github.com/oss-review-toolkit/ort/releases/download/99.1.0"
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' "$base/ort-99.1.0.tgz" -o ort.tgz
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' "$base/ort-99.1.0.tgz.asc" -o ort.tgz.asc
          echo "$ORT_SHA256  ort.tgz" | sha256sum --check
          echo "$ORT_SIGNATURE_SHA256  ort.tgz.asc" | sha256sum --check
          python - <<'PY'
          import os
          import tarfile
          from pathlib import Path, PurePosixPath

          target_root = Path(os.environ["RUNNER_TEMP"]) / "ort-dist"
          target_root.mkdir()
          with tarfile.open("ort.tgz", "r:gz") as archive:
              members = archive.getmembers()
              for member in members:
                  member_path = PurePosixPath(member.name)
                  if member_path.is_absolute() or ".." in member_path.parts:
                      raise SystemExit("ORT archive contains an unsafe path")
                  if not (member.isdir() or member.isfile() or member.issym()):
                      raise SystemExit("ORT archive contains an unsupported file type")
              # Python 3.12 data filter rejects links that escape the extraction root.
              archive.extractall(path=target_root, members=members, filter="data")
          PY
          ORT_BIN="$(find "$RUNNER_TEMP/ort-dist" -type f -path '*/bin/ort' -print -quit)"
          test -n "$ORT_BIN"
          test -f "$ORT_BIN" && test ! -L "$ORT_BIN"
          chmod 700 "$ORT_BIN"
          echo "ORT_BIN=$ORT_BIN" >> "$GITHUB_ENV"
          "$ORT_BIN" --version

      - name: Download and verify ScanCode Toolkit v32.5.0 PyPI wheel
        env:
          SCANCODE_SHA256: f6bc16880d495393c8475a77155ddc38a800c0b7f8f75e81a165a00fadb4ca06
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scancode-wheel"
          python -m pip download --no-deps --only-binary=:all: --python-version 3.12 --dest "$RUNNER_TEMP/scancode-wheel" "scancode-toolkit==32.5.0"
          WHEEL="$RUNNER_TEMP/scancode-wheel/scancode_toolkit-32.5.0-cp312-none-any.whl"
          test -f "$WHEEL"
          echo "$SCANCODE_SHA256  $WHEEL" | sha256sum --check
          printf "pluggy==1.6.0\\n" > "$RUNNER_TEMP/scancode-constraints.txt"
          python -m pip install --only-binary=:all: --no-deps --constraint "$RUNNER_TEMP/scancode-constraints.txt" --report "$RUNNER_TEMP/scancode-install-report.json" "$WHEEL"
          scancode --version

      - name: Scan complete CK-NEXUS source tree with ScanCode
        run: |
          set -euo pipefail
          scancode --license --copyright --package --info --json-pp "$RUNNER_TEMP/scancode-full-repo.json" . --ignore ".git/**" --ignore ".venv/**" --ignore "node_modules/**" --ignore ".env*" --ignore "**/.env*" --ignore "**/__pycache__/**" --ignore "**/.pytest_cache/**" --ignore "**/dist/**" --ignore "**/build/**"
          mkdir -p evidence/assurance/shadow/q16
          cp "$RUNNER_TEMP/scancode-full-repo.json" evidence/assurance/shadow/q16/scancode-full-repo.json
          cp "$RUNNER_TEMP/scancode-install-report.json" evidence/assurance/shadow/q16/scancode-install-report.json

      - name: Install pinned ORT Python Inspector dependency
        env:
          PYTHON_INSPECTOR_SHA256: 8aa5b0f93fc9150377459fd08d0cf2c7a0348e93ae24c6c5f22f3052114daa7b
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/python-inspector-wheel"
          python -m pip download --no-deps --only-binary=:all: --dest "$RUNNER_TEMP/python-inspector-wheel" "python-inspector==0.15.2"
          WHEEL="$RUNNER_TEMP/python-inspector-wheel/python_inspector-0.15.2-py3-none-any.whl"
          test -f "$WHEEL"
          echo "$PYTHON_INSPECTOR_SHA256  $WHEEL" | sha256sum --check
          python -m pip install --only-binary=:all: --no-deps --constraint "$RUNNER_TEMP/scancode-constraints.txt" --report "$RUNNER_TEMP/python-inspector-install-report.json" "$WHEEL"
          python-inspector --version
          # python-inspector 0.15.2 imports distutils; Python 3.12 removed it.
          # Setuptools' pinned compatibility shim restores the import without
          # changing the interpreter or weakening ORT's unresolved-issue policy.
          python -m pip install --only-binary=:all: --no-deps "setuptools==80.9.0"
          python -c "import distutils.core; import setuptools; print('setuptools compatibility shim:', setuptools.__version__)"

      - name: Run ORT analyzer and ScanCode-backed scanner on synthetic fixture
        env:
          ORT_DATA_DIR: ${{ runner.temp }}/ort-data
          ORT_CONFIG_DIR: ${{ runner.temp }}/ort-config
          LC_ALL: en_US.UTF-8
        run: |
          set -euo pipefail
          mkdir -p "$ORT_DATA_DIR" "$ORT_CONFIG_DIR" "$RUNNER_TEMP/q16"
          cp scripts/assurance/ort-q16-config.yml "$ORT_CONFIG_DIR/config.yml"
          "$ORT_BIN" --info analyze -f JSON -i tests/fixtures/q16-license -o "$RUNNER_TEMP/q16/analyzer"
          ANALYZER_RESULT="$RUNNER_TEMP/q16/analyzer/analyzer-result.json"
          test -f "$ANALYZER_RESULT"
          cp "$ANALYZER_RESULT" evidence/assurance/shadow/q16/analyzer-result.json
          "$ORT_BIN" scan -i "$ANALYZER_RESULT" -o "$RUNNER_TEMP/q16/scanner"
          SCAN_RESULT="$RUNNER_TEMP/q16/scanner/scan-result.yml"
          test -f "$SCAN_RESULT"
          cp "$SCAN_RESULT" evidence/assurance/shadow/q16/scan-result.yml

      - name: Analyze and scan full CK-NEXUS dependency graph with ORT
        env:
          ORT_DATA_DIR: ${{ runner.temp }}/ort-data
          ORT_CONFIG_DIR: ${{ runner.temp }}/ort-config
          LC_ALL: en_US.UTF-8
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ort-source"
          rsync -a \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='node_modules' \
            --exclude='**/node_modules/**' \
            --exclude='**/__pycache__/**' \
            --exclude='**/.pytest_cache/**' \
            --exclude='**/dist/**' \
            --exclude='**/build/**' \
            --exclude='evidence/assurance/shadow/**' \
            --exclude='**/.env*' \
            ./ "$RUNNER_TEMP/ort-source/"
          "$ORT_BIN" --info analyze -f JSON \
            -i "$RUNNER_TEMP/ort-source" \
            -o "$RUNNER_TEMP/q16/repo-analyzer"
          REPO_ANALYZER_RESULT="$RUNNER_TEMP/q16/repo-analyzer/analyzer-result.json"
          test -f "$REPO_ANALYZER_RESULT"
          "$ORT_BIN" scan \
            -i "$REPO_ANALYZER_RESULT" \
            -o "$RUNNER_TEMP/q16/repo-scanner"
          REPO_SCAN_RESULT="$RUNNER_TEMP/q16/repo-scanner/scan-result.yml"
          test -f "$REPO_SCAN_RESULT"
          cp "$REPO_ANALYZER_RESULT" evidence/assurance/shadow/q16/ort-full-repo-analyzer-result.json
          cp "$REPO_SCAN_RESULT" evidence/assurance/shadow/q16/ort-full-repo-scan-result.yml

      - name: Create candidate-bound Q16 evidence manifest
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/assurance/q16_evidence_manifest.py
          cat evidence/assurance/shadow/q16/q16-evidence.json

      - name: Validate Q16 evidence through CK-NEXUS EvidenceGraph
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONPATH: .
        run: |
          python scripts/assurance/evidence_graph_intake.py

      - name: Run evidence and graph intake unit tests
        run: |
          python -m unittest tests.assurance.test_q16_evidence_manifest -v
          python -m unittest tests.assurance.test_evidence_graph_intake -v

      - name: Retain candidate-bound Q16 evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q16-license-evidence-${{ github.sha }}
          path: |
            evidence/assurance/shadow/q16/**
          if-no-files-found: error
          retention-days: 30
