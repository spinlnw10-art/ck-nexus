name: Q16 ORT and ScanCode Shadow

on:
  pull_request:
    paths:
      - "tests/fixtures/q16-license/**"
      - "scripts/assurance/q16_evidence_manifest.py"
      - "scripts/assurance/evidence_graph_intake.py"
      - "tests/assurance/test_evidence_graph_intake.py"
      - "scripts/assurance/ort-q16-config.yml"
      - "tests/assurance/test_q16_evidence_manifest.py"
      - ".github/workflows/q16-ort-scancode-shadow.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q16-ort-scancode-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact pull request candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Java 25 for ORT
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Download and hash-verify ORT 99.1.0
        env:
          ORT_SHA256: 1c0bf055287f860902ecf98e60f271c62952ea7c2df4697126ca27e8be9e5842
          ORT_SIGNATURE_SHA256: 677fb089eb2131a7a3d1b4d182de20740d08f6b078fae01f4306b30ba233a6e5
        run: |
          set -euo pipefail
          base="https://github.com/oss-review-toolkit/ort/releases/download/99.1.0"
          curl --fail --location --retry 3 "$base/ort-99.1.0.tgz" -o ort.tgz
          curl --fail --location --retry 3 "$base/ort-99.1.0.tgz.asc" -o ort.tgz.asc
          echo "$ORT_SHA256  ort.tgz" | sha256sum --check
          echo "$ORT_SIGNATURE_SHA256  ort.tgz.asc" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ort-dist"
          tar -xzf ort.tgz -C "$RUNNER_TEMP/ort-dist"
          ORT_BIN="$(find "$RUNNER_TEMP/ort-dist" -path '*/bin/ort' -print -quit)"
          test -n "$ORT_BIN"
          chmod +x "$ORT_BIN"
          echo "ORT_BIN=$ORT_BIN" >> "$GITHUB_ENV"
          "$ORT_BIN" --version

      - name: Download and verify ScanCode Toolkit v32.5.0 PyPI wheel
        env:
          SCANCODE_SHA256: f6bc16880d495393c8475a77155ddc38a800c0b7f8f75e81a165a00fadb4ca06
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scancode-wheel"
          python -m pip download --no-deps --only-binary=:all: --python-version 3.12 --dest "$RUNNER_TEMP/scancode-wheel" "scancode-toolkit==32.5.0"
          WHEEL="$(find "$RUNNER_TEMP/scancode-wheel" -maxdepth 1 -type f -name 'scancode_toolkit-32.5.0-cp312-none-any.whl' -print -quit)"
          test -n "$WHEEL"
          echo "$SCANCODE_SHA256  $WHEEL" | sha256sum --check
          printf "pluggy==1.6.0\\n" > "$RUNNER_TEMP/scancode-constraints.txt"
          python -m pip install --constraint "$RUNNER_TEMP/scancode-constraints.txt" --report "$RUNNER_TEMP/scancode-install-report.json" "$WHEEL"
          echo "SCANCODE_INSTALL_REPORT=$RUNNER_TEMP/scancode-install-report.json" >> "$GITHUB_ENV"
          scancode --version

      - name: Scan complete CK-NEXUS source tree with ScanCode
        run: |
          set -euo pipefail
          scancode --license --copyright --package --info --json-pp "$RUNNER_TEMP/scancode-full-repo.json" . --ignore ".git/**" --ignore ".venv/**" --ignore "node_modules/**" --ignore "**/__pycache__/**" --ignore "**/.pytest_cache/**" --ignore "**/dist/**" --ignore "**/build/**"

      - name: Run ORT analyzer and ScanCode-backed scanner on synthetic fixture
        env:
          ORT_DATA_DIR: ${{ runner.temp }}/ort-data
          ORT_CONFIG_DIR: ${{ runner.temp }}/ort-config
          LC_ALL: en_US.UTF-8
        run: |
          set -euo pipefail
          mkdir -p "$ORT_DATA_DIR" "$ORT_CONFIG_DIR" "$RUNNER_TEMP/q16/analyzer" "$RUNNER_TEMP/q16/scanner"
          cp scripts/assurance/ort-q16-config.yml "$ORT_CONFIG_DIR/config.yml"
          "$ORT_BIN" --info analyze -f JSON -i tests/fixtures/q16-license -o "$RUNNER_TEMP/q16/analyzer"
          ANALYZER_RESULT="$(find "$RUNNER_TEMP/q16/analyzer" -maxdepth 1 -type f \( -name 'analyzer-result.json' -o -name 'analyzer-result.yml' \) -print -quit)"
          test -n "$ANALYZER_RESULT"
          "$ORT_BIN" scan -i "$ANALYZER_RESULT" -o "$RUNNER_TEMP/q16/scanner"
          SCAN_RESULT="$(find "$RUNNER_TEMP/q16/scanner" -maxdepth 1 -type f \( -name 'scan-result.yml' -o -name 'scan-result.json' \) -print -quit)"
          test -n "$SCAN_RESULT"
          echo "ORT_ANALYZER_RESULT=$ANALYZER_RESULT" >> "$GITHUB_ENV"
          echo "ORT_SCAN_RESULT=$SCAN_RESULT" >> "$GITHUB_ENV"

      - name: Create candidate-bound Q16 evidence manifest
        run: |
          python scripts/assurance/q16_evidence_manifest.py --candidate-sha "$GITHUB_SHA" --allowed-root "$RUNNER_TEMP" --scancode-report "$RUNNER_TEMP/scancode-full-repo.json" --scancode-install-report "$SCANCODE_INSTALL_REPORT" --ort-analyzer-result "$ORT_ANALYZER_RESULT" --ort-scan-result "$ORT_SCAN_RESULT" --output "$RUNNER_TEMP/q16/q16-evidence.json"
          cat "$RUNNER_TEMP/q16/q16-evidence.json"

      - name: Validate Q16 evidence through CK-NEXUS EvidenceGraph
        run: |
          python scripts/assurance/evidence_graph_intake.py \
            --manifest "$RUNNER_TEMP/q16/q16-evidence.json" \
            --allowed-root "$RUNNER_TEMP" \
            --output "$RUNNER_TEMP/q16/q16-evidence-graph.json"

      - name: Run evidence and graph intake unit tests
        run: |
          python -m unittest tests.assurance.test_q16_evidence_manifest -v
          python -m unittest tests.assurance.test_evidence_graph_intake -v

      - name: Retain candidate-bound Q16 evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q16-license-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/scancode-full-repo.json
            ${{ runner.temp }}/scancode-install-report.json
            ${{ runner.temp }}/q16/**
          if-no-files-found: error
          retention-days: 30
