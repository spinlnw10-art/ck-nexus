name: GUAC Shadow Intake

on:
  pull_request:
    paths:
      - "scripts/assurance/guac_shadow_intake.py"
      - "tests/assurance/test_guac_shadow_intake.py"
      - "scripts/assurance/GUAC_SHADOW_INTAKE.md"
      - ".github/workflows/guac-shadow-intake.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guac-shadow-intake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-intake-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact pull request candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run offline GUAC intake tests
        run: python -m unittest tests.assurance.test_guac_shadow_intake -v
