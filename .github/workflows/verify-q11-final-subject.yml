name: Verify Q11 live provider on current release subject

on:
  push:
    branches: [verify/q11-final-subject]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  q11:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact caller candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve immutable release identity
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          tree=$(git rev-parse 'HEAD^{tree}')
          subject=$(python3 scripts/release_subject_manifest.py)
          test "$sha" = "$GITHUB_SHA"
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "source_tree=$tree" >> "$GITHUB_OUTPUT"
          echo "release_subject=$subject" >> "$GITHUB_OUTPUT"

      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Verify frozen environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "uv==0.12.4"
          uv lock --check
          uv sync --all-extras --dev --frozen

      - name: Run one bounded Responses API smoke request
        id: smoke
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SMOKE_MODEL: ${{ vars.OPENAI_SMOKE_MODEL }}
        run: |
          set +e
          .venv/bin/python scripts/test_openai_live.py >q11-output.txt 2>&1
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Emit exact Q11 evidence
        env:
          RUN_ID: ${{ github.run_id }}
          RC: ${{ steps.smoke.outputs.rc }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SOURCE_SHA: ${{ steps.subject.outputs.source_sha }}
          SOURCE_TREE: ${{ steps.subject.outputs.source_tree }}
          RELEASE_SUBJECT: ${{ steps.subject.outputs.release_subject }}
        run: |
          .venv/bin/python - <<'PYTHON'
          import json, os
          from pathlib import Path
          rc=int(os.environ.get("RC","2"))
          text=Path("q11-output.txt").read_text(encoding="utf-8").strip()
          status="PASS" if rc==0 else ("BLOCKED" if rc==2 else "FAIL")
          evidence={
            "schema_version":5,
            "gate":"Q11",
            "source_sha":os.environ["SOURCE_SHA"],
            "source_tree":os.environ["SOURCE_TREE"],
            "release_subject_manifest_sha256":os.environ["RELEASE_SUBJECT"],
            "github_run_id":int(os.environ["RUN_ID"]),
            "credential_configured":bool(os.environ.get("OPENAI_API_KEY","").strip()),
            "credential_exposed":False,
            "p0_ai_001_exit_code":rc,
            "sentinel_observed":"CK-NEXUS-P0-SMOKE-PASS" in text,
            "result":status,
            "production_promotion_allowed":rc==0,
            "diagnostic":text[:1000],
          }
          Path("Q11_OPENAI_LIVE.json").write_text(json.dumps(evidence,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps({k:v for k,v in evidence.items() if k!="diagnostic"},indent=2,sort_keys=True))
          PYTHON

      - name: Upload Q11 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: q11-current-${{ github.sha }}
          path: |
            Q11_OPENAI_LIVE.json
            q11-output.txt
          if-no-files-found: error
          retention-days: 90

      - name: Enforce Q11
        run: test '${{ steps.smoke.outputs.rc }}' -eq 0
