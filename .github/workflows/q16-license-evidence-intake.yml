name: Q16 License Evidence Intake

on:
  pull_request:
    paths:
      - "scripts/assurance/q16_license_evidence_intake.py"
      - "tests/assurance/test_q16_license_evidence_intake.py"
      - "scripts/assurance/Q16_ORT_SCANCODE_SHADOW.md"
      - ".github/workflows/q16-license-evidence-intake.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-intake-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run offline Q16 tests
        run: python -m unittest tests/assurance/test_q16_license_evidence_intake.py -v
